# Render blueprint — single web service that serves both the API and the React SPA.
#
# What it does:
#   build  → installs root + server deps, builds the Vite app into ./dist
#   start  → Express serves /api/* and the static SPA from the same origin
#
# Required manual step: paste your Neon connection string into the DATABASE_URL
# environment variable in the Render dashboard (it is marked sync: false). The
# schema is created automatically on first start.

services:
  - type: web
    name: aapka-pg
    runtime: node
    plan: free
    region: singapore
    branch: main
    # `--include=dev` is required: NODE_ENV=production makes npm omit
    # devDependencies, but the build needs typescript, vite and @types/*.
    buildCommand: npm ci --include=dev && npm ci --prefix server && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      # Neon connection string, e.g.
      # postgresql://USER:PASS@ep-xxxx-pooler.REGION.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and kept secret.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Same-origin deployment, so CORS is not needed. Set this to your service
      # URL only if the API is ever called from a different origin.
      - key: CORS_ORIGIN
        sync: false
